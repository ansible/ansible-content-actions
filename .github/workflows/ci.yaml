name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: null

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
  self-ansible-lint:
    uses: ./.github/workflows/ansible_lint.yaml
  self-build-import:
    uses: ./.github/workflows/build_import.yaml
  self-sanity:
    uses: ./.github/workflows/sanity.yaml
  self-unit:
    uses: ./.github/workflows/unit.yaml
  self-integration:
    uses: ./.github/workflows/integration.yaml

  check:
    if: always()
    permissions:
      id-token: write
      checks: read
    runs-on: ubuntu-latest
    needs:
      - lint
      - self-ansible-lint
      - self-build-import
      - self-sanity
      - self-unit
      - self-integration
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
